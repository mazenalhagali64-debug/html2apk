<script>
  // تحميل المكتبات مع خطة بديلة (fallback) بين أكثر من CDN، وإظهار أي خطأ بدل شاشة فاضية
  (function () {
    var statusEl = document.getElementById('boot-status');
    function setStatus(msg, isError) {
      statusEl.innerHTML = isError
        ? '<div class="err">⚠️ ' + msg + '</div><button onclick="location.reload()">إعادة المحاولة</button>'
        : '<div class="spinner"></div><div>' + msg + '</div>';
    }
    window.addEventListener('error', function (e) {
      if (statusEl && !statusEl.classList.contains('hidden')) {
        setStatus('صار خطأ أثناء تشغيل التطبيق:\n' + (e.message || e.error), true);
      }
    });
    window.__hideBootStatus = function () {
      statusEl.classList.add('hidden');
    };

    var CDN_SOURCES = [
      {
        react: 'https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js',
        reactDom: 'https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js',
        babel: 'https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js',
      },
      {
        react: 'https://unpkg.com/react@18/umd/react.production.min.js',
        reactDom: 'https://unpkg.com/react-dom@18/umd/react-dom.production.min.js',
        babel: 'https://unpkg.com/@babel/standalone/babel.min.js',
      },
      {
        react: 'https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js',
        reactDom: 'https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js',
        babel: 'https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js',
      },
    ];

    function loadScript(src) {
      return new Promise(function (resolve, reject) {
        var s = document.createElement('script');
        s.src = src;
        s.crossOrigin = 'anonymous';
        s.onload = resolve;
        s.onerror = function () { reject(new Error('فشل تحميل: ' + src)); };
        document.head.appendChild(s);
      });
    }

    function loadSet(set) {
      return loadScript(set.react)
        .then(function () { return loadScript(set.reactDom); })
        .then(function () { return loadScript(set.babel); });
    }

    function tryLoadAll(index) {
      if (index >= CDN_SOURCES.length) {
        setStatus('ما قدرت أحمّل مكتبات التطبيق (React). تأكد من الاتصال بالإنترنت وجرّب إعادة المحاولة.', true);
        return;
      }
      setStatus('عم يتحمّل التطبيق' + (index > 0 ? ' (مصدر بديل ' + (index + 1) + ')' : '') + '…');
      loadSet(CDN_SOURCES[index])
        .then(function () {
          if (!window.React || !window.ReactDOM || !window.Babel) {
            throw new Error('تحمّلت الملفات لكن المكتبات مش موجودة');
          }
          runApp();
        })
        .catch(function (err) {
          console.warn(err);
          tryLoadAll(index + 1);
        });
    }

    function runApp() {
      try {
        var appScript = document.getElementById('app-source');
        var compiled = Babel.transform(appScript.textContent, { presets: ['react'] }).code;
        var script = document.createElement('script');
        script.textContent = compiled;
        document.body.appendChild(script);
        window.__hideBootStatus();
      } catch (err) {
        setStatus('صار خطأ بتشغيل كود التطبيق:\n' + err.message, true);
        console.error(err);
      }
    }

    tryLoadAll(0);
  })();
</script>

// ---------- تصنيفات العرض (مبنية من فئات الكتالوج نفسها) ----------
function buildCategoryList(products) {
  const set = new Set(products.map(p => p.category || 'أخرى'));
  return Array.from(set).sort((a, b) => a.localeCompare(b, 'ar'));
}

// ---------- fuzzy search بسيط بدون مكتبات خارجية ----------
function normalizeArabic(str) {
  return String(str || '')
    .replace(/[أإآ]/g, 'ا')
    .replace(/ة/g, 'ه')
    .replace(/ى/g, 'ي')
    .replace(/[\u064B-\u0652]/g, '') // تشكيل
    .toLowerCase()
    .trim();
}

function fuzzyScore(query, target) {
  const q = normalizeArabic(query);
  const t = normalizeArabic(target);
  if (!q) return 1;
  if (t.includes(q)) return 100 - (t.indexOf(q) * 0.5);
  const qWords = q.split(/\s+/).filter(Boolean);
  const matched = qWords.filter(w => t.includes(w)).length;
  if (matched === 0) return 0;
  return (matched / qWords.length) * 60;
}

const fmt = (n) => new Intl.NumberFormat('en-US', { maximumFractionDigits: 2, minimumFractionDigits: 0 }).format(Number.isFinite(n) ? n : 0);
const fmtInt = (n) => new Intl.NumberFormat('en-US').format(Math.round(Number.isFinite(n) ? n : 0));
const fmtSYP = (n) => `${fmtInt(n)} ل.س`;
const fmtUSD = (n) => `$${fmt(n)}`;

function uid(prefix) {
  return `${prefix}${Date.now()}${Math.floor(Math.random() * 1000)}`;
}

// ---------- استيراد كتالوج من ملف Excel / CSV ----------
// يقبل أعمدة بأي ترتيب طالما فيها أسماء قريبة من: مسلسل/رمز/نوع/فئة/اسم/وحدة/شراء/بيع
const COLUMN_ALIASES = {
  num: ['مسلسل', 'م', 'رقم'],
  code: ['رمز المادة', 'رمز', 'كود'],
  type: ['نوع المادة', 'نوع'],
  category: ['فئة المادة', 'فئة', 'الفئة'],
  name: ['اسم المادة', 'اسم', 'الاسم', 'المادة'],
  unit: ['الوحدة النظامية', 'الوحدة', 'وحدة'],
  cost: ['إفرادي الشراء', 'سعر الشراء', 'الشراء', 'كلفة'],
  sell: ['سعر البيع', 'البيع', 'سعر بيع'],
};

function guessColumnMap(headerRow) {
  const map = {};
  headerRow.forEach((h, idx) => {
    const val = String(h || '').trim();
    for (const [key, aliases] of Object.entries(COLUMN_ALIASES)) {
      if (aliases.some(a => val.includes(a))) {
        if (!(key in map)) map[key] = idx;
      }
    }
  });
  return map;
}

function toNumberLoose(v) {
  if (v === null || v === undefined) return 0;
  if (typeof v === 'number') return v;
  const s = String(v).replace(/,/g, '').trim();
  if (!s || s === 'نان' || s === 'None') return 0;
  const n = parseFloat(s);
  return Number.isFinite(n) ? n : 0;
}

// محلل CSV بسيط بدون أي مكتبة خارجية (يشتغل دايماً حتى لو مكتبة xlsx ما توفرت)
function parseCSVText(text) {
  // يدعم الفواصل (,) والفاصلة المنقوطة (;) ويتجاهل الأسطر الفاضية
  const firstLine = text.split(/\r?\n/).find(l => l.trim() !== '') || '';
  const delimiter = (firstLine.match(/;/g)?.length || 0) > (firstLine.match(/,/g)?.length || 0) ? ';' : ',';

  const rows = [];
  let row = [];
  let field = '';
  let inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQuotes) {
      if (ch === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else inQuotes = false;
      } else field += ch;
    } else {
      if (ch === '"') inQuotes = true;
      else if (ch === delimiter) { row.push(field); field = ''; }
      else if (ch === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else if (ch === '\r') { /* تجاهل */ }
      else field += ch;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim() !== ''));
}

function rowsToProducts(rows, existingCount) {
  // دوّر على أول سطر فيه أغلب رؤوس الأعمدة المتوقعة
  let headerIdx = -1;
  let colMap = {};
  for (let i = 0; i < Math.min(rows.length, 10); i++) {
    const map = guessColumnMap(rows[i]);
    if (Object.keys(map).length >= 3 && map.name !== undefined) {
      headerIdx = i;
      colMap = map;
      break;
    }
  }
  if (headerIdx === -1) {
    throw new Error('ما قدرت ألاقي أعمدة معروفة (اسم المادة، السعر...) بالملف. تأكد إن أول صف فيه عناوين الأعمدة.');
  }

  const dataRows = rows.slice(headerIdx + 1);
  const products = [];
  let n = existingCount;
  for (const r of dataRows) {
    const name = colMap.name !== undefined ? String(r[colMap.name] || '').trim() : '';
    if (!name) continue;
    n += 1;
    const cost = colMap.cost !== undefined ? toNumberLoose(r[colMap.cost]) : 0;
    const sell = colMap.sell !== undefined ? toNumberLoose(r[colMap.sell]) : 0;
    products.push({
      id: uid('imp'),
      num: colMap.num !== undefined ? (toNumberLoose(r[colMap.num]) || n) : n,
      code: colMap.code !== undefined ? String(r[colMap.code] || '').trim() : '',
      type: colMap.type !== undefined ? String(r[colMap.type] || '').trim() : 'مستورد',
      category: colMap.category !== undefined ? String(r[colMap.category] || '').trim() : 'مستورد',
      name,
      unit: colMap.unit !== undefined ? (String(r[colMap.unit] || '').trim() || 'عدد') : 'عدد',
      costSYP: cost,
      sellPriceSYP: sell > 0 ? sell : null,
      qty: 0,
      isNew: true,
      supplier: 'مستورد من ملف',
    });
  }
  return products;
}

// بيقرأ الملف ويرجّع مصفوفة صفوف (rows[][]) — بيستخدم مكتبة xlsx لملفات إكسل الحقيقية،
// وبيستخدم المحلل الداخلي لملفات CSV دايماً (ما بيحتاج أي مكتبة خارجية)
async function readFileToRows(file) {
  const isCsv = /\.csv$/i.test(file.name) || file.type === 'text/csv';

  if (isCsv) {
    const text = await file.text();
    return parseCSVText(text);
  }

  // ملف إكسل (.xlsx / .xls) — يحتاج مكتبة xlsx (بتنحمّل ديناميكياً هون فقط)
  let XLSX;
  try {
    XLSX = await loadXLSXLib();
  } catch {
    throw new Error('قراءة ملفات Excel مش متوفرة بهالنسخة من التطبيق. جرّب تحفظ الملف بصيغة CSV (من إكسل: ملف ← حفظ باسم ← CSV) وارفعه هيك.');
  }
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, { type: 'array' });
        const sheetName = wb.SheetNames[0];
        const sheet = wb.Sheets[sheetName];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
        resolve(rows);
      } catch (err) {
        reject(new Error('ما قدرت أقرأ ملف الإكسل. جرّب تصدّره بصيغة CSV وارفعه.'));
      }
    };
    reader.onerror = () => reject(new Error('صار خطأ بقراءة الملف من الجهاز.'));
    reader.readAsArrayBuffer(file);
  });
}

async function parseFileToProducts(file, existingCount) {
  const rows = await readFileToRows(file);
  return rowsToProducts(rows, existingCount);
}

const STORAGE_KEY = 'workshop_pro_state_v1';

function loadPersistedState() {
  try {
    const raw = window.localStorage?.getItem(STORAGE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch {
    return null;
  }
}

function persistState(state) {
  try {
    window.localStorage?.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch {
    // تجاهل أخطاء التخزين (مثلاً وضع خاص أو مساحة ممتلئة)
  }
}

function InvoiceView({ products, adjustStock, customers, addCustomer, invoices, setInvoices, shop, showToast, setViewInvoice }) {
  const nextInvoiceNumber = () => {
    const nums = invoices.map(i => i.number || 0);
    return (nums.length ? Math.max(...nums) : 0) + 1;
  };
  const [type, setType] = useState('sell'); // sell | buy
  const [customerId, setCustomerId] = useState(customers[0]?.id);
  const [lines, setLines] = useState([]); // {productId, name, unit, qty, unitPrice, availableQty}
  const [query, setQuery] = useState('');
  const [discountType, setDiscountType] = useState('percent'); // percent | amount
  const [discountValue, setDiscountValue] = useState(0);
  const [showList, setShowList] = useState(false);
  const [paymentType, setPaymentType] = useState('cash'); // cash | debt
  const [paidNow, setPaidNow] = useState(''); // للدفع الجزئي عند البيع بدين
  const [newCustName, setNewCustName] = useState('');
  const [showNewCust, setShowNewCust] = useState(false);

  useEffect(() => {
    if (!customerId && customers.length) setCustomerId(customers[0].id);
  }, [customers, customerId]);

  const searchResults = useMemo(() => {
    if (!query.trim()) return [];
    return products
      .map(p => ({ p, score: fuzzyScore(query, p.name) }))
      .filter(x => x.score > 0)
      .sort((a, b) => b.score - a.score)
      .slice(0, 8)
      .map(x => x.p);
  }, [products, query]);

  const addLine = (product) => {
    setLines(prev => {
      const existing = prev.find(l => l.productId === product.id);
      if (existing) {
        return prev.map(l => l.productId === product.id ? { ...l, qty: l.qty + 1 } : l);
      }
      const price = type === 'sell' ? (product.sellPriceSYP ?? product.costSYP) : product.costSYP;
      return [...prev, {
        productId: product.id, name: product.name, unit: product.unit,
        qty: 1, unitPrice: price, availableQty: product.qty,
      }];
    });
    setQuery('');
    setShowList(false);
  };

  const updateLine = (productId, patch) => {
    setLines(prev => prev.map(l => l.productId === productId ? { ...l, ...patch } : l));
  };

  const removeLine = (productId) => {
    setLines(prev => prev.filter(l => l.productId !== productId));
  };

  const subtotal = lines.reduce((sum, l) => sum + (l.qty * l.unitPrice), 0);
  const discountAmount = discountType === 'percent'
    ? subtotal * (parseFloat(discountValue || 0) / 100)
    : parseFloat(discountValue || 0);
  const total = Math.max(0, subtotal - discountAmount);

  const shortageLines = type === 'sell' ? lines.filter(l => l.qty > l.availableQty) : [];

  const paidAmount = paymentType === 'debt' ? Math.min(total, parseFloat(paidNow || 0)) : total;
  const remainingDebt = Math.max(0, total - paidAmount);

  const canSubmit = lines.length > 0 && customerId;

  const doAddCustomer = () => {
    if (!newCustName.trim()) return;
    const c = addCustomer(newCustName.trim());
    setCustomerId(c.id);
    setNewCustName('');
    setShowNewCust(false);
  };

  const submitInvoice = () => {
    if (!canSubmit) return;
    const invoice = {
      id: uid('inv'),
      number: nextInvoiceNumber(),
      type,
      customerId,
      lines,
      subtotal,
      discountAmount,
      total,
      paymentType: type === 'sell' ? paymentType : 'cash',
      paidAmount: type === 'sell' ? paidAmount : total,
      remainingDebt: type === 'sell' ? remainingDebt : 0,
      hadShortage: shortageLines.length > 0,
      date: new Date().toISOString(),
    };
    setInvoices(prev => [invoice, ...prev]);
    lines.forEach(l => {
      adjustStock(l.productId, type === 'sell' ? -l.qty : l.qty);
    });
    setLines([]);
    setDiscountValue(0);
    setPaidNow('');
    setPaymentType('cash');
    showToast(
      type === 'sell'
        ? (remainingDebt > 0 ? 'تم إصدار الفاتورة — بقي دين على الزبون ✓' : 'تم إصدار فاتورة البيع ✓')
        : 'تم تسجيل فاتورة الشراء ✓'
    );
    setViewInvoice(invoice);
  };

  return (
    <div style={styles.view}>
      <div style={styles.segmentedRow}>
        <button
          style={{ ...styles.segment, ...(type === 'sell' ? styles.segmentActive : {}) }}
          onClick={() => setType('sell')}
        >فاتورة بيع</button>
        <button
          style={{ ...styles.segment, ...(type === 'buy' ? styles.segmentActive : {}) }}
          onClick={() => setType('buy')}
        >فاتورة شراء</button>
      </div>

      <div style={styles.fieldBlock}>
        <label style={styles.fieldLabel}>العميل / المورد</label>
        {!showNewCust ? (
          <div style={styles.custRow}>
            <select style={styles.select} value={customerId} onChange={e => setCustomerId(e.target.value)}>
              {customers.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
            </select>
            <button style={styles.newCustBtn} onClick={() => setShowNewCust(true)}><Plus size={16} /></button>
          </div>
        ) : (
          <div style={styles.addRow}>
            <input
              style={styles.addInput}
              placeholder="اسم العميل الجديد..."
              value={newCustName}
              onChange={e => setNewCustName(e.target.value)}
              onKeyDown={e => e.key === 'Enter' && doAddCustomer()}
              autoFocus
            />
            <button style={styles.addBtn} onClick={doAddCustomer}><CheckCircle2 size={18} /></button>
            <button style={styles.addBtnGhost} onClick={() => setShowNewCust(false)}><X size={16} /></button>
          </div>
        )}
      </div>

      <div style={styles.fieldBlock}>
        <label style={styles.fieldLabel}>إضافة صنف</label>
        <div style={styles.searchBar}>
          <Search size={16} style={{ color: 'var(--muted)' }} />
          <input
            style={styles.searchInput}
            placeholder="دوّر عن الصنف لإضافته..."

// ---------- حساب رصيد الزبون (دين عليه) ----------
function computeCustomerBalance(customerId, invoices, payments) {
  const debtFromInvoices = invoices
    .filter(i => i.customerId === customerId && i.type === 'sell')
    .reduce((s, i) => s + (i.remainingDebt || 0), 0);
  const paid = payments
    .filter(p => p.customerId === customerId)
    .reduce((s, p) => s + p.amount, 0);
  return Math.max(0, debtFromInvoices - paid);
}

// تقييم موثوقية العميل بناءً على تاريخه بالدفع
// يرجع: { label, color, score } حسب: نسبة الفواتير المسدّدة بالكامل + سرعة التسديد
function computeCustomerReliability(customerId, invoices, payments) {
  const sellInvoices = invoices.filter(i => i.customerId === customerId && i.type === 'sell');
  if (sellInvoices.length === 0) {
    return { label: 'ما في بيانات كافية', color: 'var(--muted)', score: null };
  }
  const withDebtOriginally = sellInvoices.filter(i => i.paymentType === 'debt');
  if (withDebtOriginally.length === 0) {
    return { label: 'يدفع كاش دايمًا', color: 'var(--ok)', score: 100 };
  }
  const stillOwing = withDebtOriginally.filter(i => (i.remainingDebt || 0) > 0).length;
  const settledRatio = 1 - (stillOwing / withDebtOriginally.length);
  const pct = Math.round(settledRatio * 100);
  if (pct >= 80) return { label: 'ملتزم بالدفع', color: 'var(--ok)', score: pct };
  if (pct >= 50) return { label: 'ملتزم غالبًا', color: 'var(--accent)', score: pct };
  return { label: 'غالبًا بيتأخر', color: 'var(--danger)', score: pct };
}

// يبني خط زمني موحّد من الفواتير والدفعات مرتب من الأحدث للأقدم
function buildCustomerTimeline(customerId, invoices, payments) {
  const invEvents = invoices
    .filter(i => i.customerId === customerId)
    .map(i => ({
      kind: 'invoice',
      id: i.id,
      date: i.date,
      type: i.type,
      total: i.total,
      remainingDebt: i.remainingDebt || 0,
      number: i.number,
      raw: i,
    }));
  const payEvents = payments
    .filter(p => p.customerId === customerId)
    .map(p => ({
      kind: 'payment',
      id: p.id,
      date: p.date,
      amount: p.amount,
      raw: p,
    }));
  return [...invEvents, ...payEvents].sort((a, b) => new Date(b.date) - new Date(a.date));
}

// ================= السجل الزمني للعميل =================
function CustomerDetailModal({ customer, invoices, payments, onClose }) {
  const timeline = useMemo(
    () => buildCustomerTimeline(customer.id, invoices, payments),
    [customer.id, invoices, payments]
  );
  const reliability = useMemo(
    () => computeCustomerReliability(customer.id, invoices, payments),
    [customer.id, invoices, payments]
  );
  const balance = computeCustomerBalance(customer.id, invoices, payments);
  const sellInvoices = invoices.filter(i => i.customerId === customer.id && i.type === 'sell');
  const totalSpent = sellInvoices.reduce((s, i) => s + i.total, 0);
  const avgTicket = sellInvoices.length ? totalSpent / sellInvoices.length : 0;

  // أكتر منتج بيشتريه العميل (حسب عدد مرات التكرار بالفواتير)
  const topProduct = useMemo(() => {
    const counts = {};
    sellInvoices.forEach(inv => {
      (inv.lines || []).forEach(l => {
        counts[l.name] = (counts[l.name] || 0) + l.qty;
      });
    });
    const entries = Object.entries(counts);
    if (!entries.length) return null;
    entries.sort((a, b) => b[1] - a[1]);
    return entries[0];
  }, [sellInvoices]);

  return (
    <div style={styles.sheetOverlay} onClick={onClose}>
      <div style={styles.sheet} onClick={e => e.stopPropagation()}>
        <div style={styles.sheetHandle} />
        <div style={styles.sheetHeader}>
          <div style={styles.customerAvatar}>{customer.name.charAt(0)}</div>
          <div style={{ flex: 1 }}>
            <div style={styles.sheetTitle}>{customer.name}</div>
            <div style={{ ...styles.sheetSub, color: reliability.color, fontWeight: 700 }}>
              {reliability.label}{reliability.score !== null ? ` · ${reliability.score}%` : ''}
            </div>
          </div>
          <button style={styles.sheetClose} onClick={onClose}><X size={18} /></button>
        </div>

        <div style={styles.timelineStatsRow}>
          <div style={styles.timelineStatBox}>
            <div style={styles.timelineStatValue}>{fmtSYP(totalSpent)}</div>
            <div style={styles.timelineStatLabel}>إجمالي المشتريات</div>
          </div>
          <div style={styles.timelineStatBox}>
            <div style={styles.timelineStatValue}>{fmtSYP(avgTicket)}</div>
            <div style={styles.timelineStatLabel}>متوسط الفاتورة</div>
          </div>
          <div style={styles.timelineStatBox}>
            <div style={{ ...styles.timelineStatValue, color: balance > 0 ? 'var(--danger)' : 'var(--ok)' }}>
              {fmtSYP(balance)}
            </div>
            <div style={styles.timelineStatLabel}>الدين الحالي</div>
          </div>
        </div>

        {topProduct && (
          <div style={styles.topProductBanner}>
            🏆 أكتر مادة بيشتريها: <b>{topProduct[0]}</b> ({fmtInt(topProduct[1])} بمجموع الفواتير)
          </div>
        )}

        <div style={styles.timelineList}>
          {timeline.length === 0 ? (
            <div style={styles.emptySmall}>ما في أي حركة بعد لهاد العميل</div>
          ) : (
            timeline.map(ev => (
              <div key={`${ev.kind}-${ev.id}`} style={styles.timelineRow}>
                <div style={{
                  ...styles.timelineDot,
                  background: ev.kind === 'payment'
                    ? 'var(--ok)'
                    : ev.type === 'sell' ? 'var(--accent)' : 'var(--muted)',
                }} />
                <div style={{ flex: 1 }}>
                  <div style={styles.timelineRowTop}>
                    <span style={styles.timelineRowTitle}>
                      {ev.kind === 'payment'
                        ? 'دفعة مسدّدة'
                        : ev.type === 'sell' ? 'فاتورة بيع' : 'فاتورة شراء'}
                    </span>
                    <span style={styles.timelineRowAmount}>
                      {fmtSYP(ev.kind === 'payment' ? ev.amount : ev.total)}
                    </span>
                  </div>
                  <div style={styles.timelineRowDate}>{new Date(ev.date).toLocaleDateString('ar')}</div>
                  {ev.kind === 'invoice' && ev.remainingDebt > 0 && (
                    <div style={styles.debtBadgeSmall}>باقي دين: {fmtSYP(ev.remainingDebt)}</div>
                  )}
                </div>
              </div>
            ))
          )}
        </div>

        <button style={styles.sheetDoneBtn} onClick={onClose}>تم</button>
      </div>
    </div>
  );
}

function InvoiceModal({ invoice, customer, shop, onClose, showToast }) {
  const exportRef = useRef(null);
  const [busy, setBusy] = useState(false);

  const buildPdf = async () => {
    const node = exportRef.current;
    if (document.fonts && document.fonts.ready) {
      try { await document.fonts.ready; } catch {}
    }
    const canvas = await html2canvas(node, { scale: 2, backgroundColor: '#ffffff', useCORS: true });
    const imgData = canvas.toDataURL('image/png');
    const { jsPDF } = window.jspdf;
    const pdfWidth = 210;
    const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
    const pdf = new jsPDF({ orientation: 'p', unit: 'mm', format: [pdfWidth, pdfHeight] });
    pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
    return pdf;
  };

  const handleDownloadPdf = async () => {
    setBusy(true);
    try {
      const pdf = await buildPdf();
      pdf.save(`فاتورة-${String(invoice.number || 1).padStart(4, '0')}.pdf`);
    } catch (e) {
      showToast && showToast('صار خطأ بإنشاء PDF');
    } finally {
      setBusy(false);
    }
  };

  const handleShare = async () => {
    setBusy(true);
    try {
      const pdf = await buildPdf();
      const blob = pdf.output('blob');
      const fileName = `فاتورة-${String(invoice.number || 1).padStart(4, '0')}.pdf`;
      const file = new File([blob], fileName, { type: 'application/pdf' });

      if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({
          title: `فاتورة ${shop.name || 'ورشة برو'}`,
          text: `فاتورة ${invoice.type === 'sell' ? 'بيع' : 'شراء'} رقم ${String(invoice.number || 1).padStart(4, '0')} — الإجمالي ${fmtSYP(invoice.total)}`,
          files: [file],
        });
      } else if (navigator.share) {
        // مشاركة بدون ملفات كخطة بديلة
        await navigator.share({ title: 'فاتورة', text: buildShareText(invoice, customer, shop) });
      } else {
        // تنزيل احتياطي إذا مافي دعم للمشاركة إطلاقاً
        pdf.save(fileName);
        showToast && showToast('المشاركة مو مدعومة، تم تنزيل PDF بدلها');
      }
    } catch (e) {
      if (e?.name !== 'AbortError') showToast && showToast('صار خطأ أثناء المشاركة');
    } finally {
      setBusy(false);
    }
  };

  return (
    <div style={styles.sheetOverlay} onClick={onClose}>
      <div style={styles.sheet} onClick={e => e.stopPropagation()}>
        <div style={styles.sheetHandle} />
        <div style={styles.sheetHeader}>
          <div style={{ flex: 1 }}>
            <div style={styles.sheetTitle}>{invoice.type === 'sell' ? 'فاتورة بيع' : 'فاتورة شراء'}</div>
            <div style={styles.sheetSub}>{new Date(invoice.date).toLocaleString('ar')}</div>
          </div>
          <button style={styles.sheetClose} onClick={onClose}><X size={18} /></button>
        </div>

        {/* معاينة داخل التطبيق */}
        <div style={{ marginBottom: 14 }}>
          <InvoicePrintable invoice={invoice} customer={customer} shop={shop} forExport={false} />
        </div>

        {/* نسخة مخفية بعرض ثابت لإنتاج PDF بجودة عالية */}
        <div style={{ position: 'fixed', top: -99999, left: -99999, pointerEvents: 'none' }}>
          <div ref={exportRef}>
            <InvoicePrintable invoice={invoice} customer={customer} shop={shop} forExport={true} />
          </div>
        </div>

        <div style={styles.invoiceActions}>
          <button style={styles.actionBtn} onClick={handleDownloadPdf} disabled={busy}>
            <FileDown size={16} /> {busy ? 'جاري التجهيز…' : 'تنزيل PDF'}
          </button>
          <button style={styles.actionBtn} onClick={handleShare} disabled={busy}>
            <Share2 size={16} /> {busy ? 'جاري التجهيز…' : 'مشاركة واتساب'}
          </button>
        </div>

        <button style={styles.sheetDoneBtn} onClick={onClose}>تم</button>
      </div>
    </div>
  );
}

function buildShareText(invoice, customer, shop) {
  const lines = invoice.lines.map(l => `${l.name} × ${l.qty} = ${fmtSYP(l.qty * l.unitPrice)}`).join('\n');
  return [
    `${shop.name || 'ورشة برو'}`,
    `فاتورة ${invoice.type === 'sell' ? 'بيع' : 'شراء'} — ${new Date(invoice.date).toLocaleDateString('ar')}`,
    `العميل: ${customer?.name || '—'}`,
    '',
    lines,
    '',
    `الإجمالي: ${fmtSYP(invoice.total)}`,
    invoice.paymentType === 'debt' ? `باقي (دين): ${fmtSYP(invoice.remainingDebt)}` : 'نقدي',
  ].join('\n');
}

function ReportsView({ products, invoices, payments }) {
  const totalInventoryValue = products.reduce((s, p) => s + (Math.max(0, p.qty) * p.costSYP), 0);
  const totalSales = invoices.filter(i => i.type === 'sell').reduce((s, i) => s + i.total, 0);
  const totalPurchases = invoices.filter(i => i.type === 'buy').reduce((s, i) => s + i.total, 0);
  const totalOutstandingDebt = invoices.filter(i => i.type === 'sell').reduce((s, i) => s + (i.remainingDebt || 0), 0)
    - payments.reduce((s, p) => s + p.amount, 0);

  const profit = invoices.filter(i => i.type === 'sell').reduce((sum, inv) => {
    const cost = inv.lines.reduce((s, l) => {
      const prod = products.find(p => p.id === l.productId);
      return s + (l.qty * (prod?.costSYP || 0));
    }, 0);
    return sum + (inv.total - cost);
  }, 0);

  const lowStock = products.filter(p => p.qty > 0 && p.qty < 5).length;
  const zeroStock = products.filter(p => p.qty === 0).length;

  return (
    <div style={styles.view}>
      <div style={styles.statsGrid}>
        <StatCard label="قيمة المخزون" value={fmtSYP(totalInventoryValue)} icon={<Package size={16} />} />
        <StatCard label="إجمالي المبيعات" value={fmtSYP(totalSales)} icon={<TrendingUp size={16} />} accent="ok" />
        <StatCard label="إجمالي المشتريات" value={fmtSYP(totalPurchases)} icon={<Receipt size={16} />} />
        <StatCard label="صافي الربح" value={fmtSYP(profit)} icon={<DollarSign size={16} />} accent={profit >= 0 ? 'ok' : 'danger'} />
      </div>

      {totalOutstandingDebt > 0 && (
        <div style={styles.alertBanner}>
          <span>💳 مجموع الديون المستحقة على العملاء: {fmtSYP(Math.max(0, totalOutstandingDebt))}</span>
        </div>
      )}

      <div style={styles.reportSection}>
        <div style={styles.recentTitle}>حالة المخزون</div>
        <div style={styles.reportLine}><span>عدد الأصناف الكلي</span><span>{products.length}</span></div>
        <div style={styles.reportLine}><span style={{ color: 'var(--warn)' }}>كمية منخفضة (أقل من 5)</span><span>{lowStock}</span></div>
        <div style={styles.reportLine}><span style={{ color: 'var(--danger)' }}>نفدت الكمية</span><span>{zeroStock}</span></div>
      </div>

      <div style={styles.reportSection}>
        <div style={styles.recentTitle}>عدد الفواتير</div>
        <div style={styles.reportLine}><span>فواتير بيع</span><span>{invoices.filter(i => i.type === 'sell').length}</span></div>
        <div style={styles.reportLine}><span>فواتير شراء</span><span>{invoices.filter(i => i.type === 'buy').length}</span></div>
        <div style={styles.reportLine}><span>دفعات مسجّلة</span><span>{payments.length}</span></div>
      </div>

      <ProfitHeatmap products={products} invoices={invoices} />
    </div>
  );
}

// ================= خريطة الربح الحرارية =================
function ProfitHeatmap({ products, invoices }) {
  // يبني: لكل فئة × كل شهر (آخر 6 أشهر فيها مبيعات)، مجموع الربح
  const { categories, months, grid, maxAbs } = useMemo(() => {
    const sellInvoices = invoices.filter(i => i.type === 'sell');
    if (sellInvoices.length === 0) {
      return { categories: [], months: [], grid: {}, maxAbs: 0 };
    }

    const monthKey = (d) => {
      const dt = new Date(d);
      return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}`;
    };
    const monthLabel = (key) => {
      const [y, m] = key.split('-');
      const names = ['ينا', 'فبر', 'مار', 'أبر', 'ماي', 'يون', 'يول', 'أغس', 'سبت', 'أكت', 'نوف', 'ديس'];
      return `${names[parseInt(m, 10) - 1]} ${y.slice(2)}`;
    };

    // مجموعة الأشهر الفعلية اللي فيها فواتير، آخر 6 أشهر فقط
    const monthSet = new Set(sellInvoices.map(i => monthKey(i.date)));
    const sortedMonths = [...monthSet].sort().slice(-6);

    const grid = {}; // { category: { monthKey: profit } }
    const categorySet = new Set();

    sellInvoices.forEach(inv => {
      const mk = monthKey(inv.date);
      if (!sortedMonths.includes(mk)) return;
      (inv.lines || []).forEach(l => {
        const prod = products.find(p => p.id === l.productId);
        const category = prod?.category || 'أخرى';
        const cost = (prod?.costSYP || 0) * l.qty;
        const revenue = (l.unitPrice || 0) * l.qty;
        const lineProfit = revenue - cost;
        categorySet.add(category);
        grid[category] = grid[category] || {};
        grid[category][mk] = (grid[category][mk] || 0) + lineProfit;
      });
    });

    // ترتيب الفئات حسب مجموع الربح الكلي تنازليًا
    const categories = [...categorySet].sort((a, b) => {
      const sumA = Object.values(grid[a] || {}).reduce((s, v) => s + v, 0);
      const sumB = Object.values(grid[b] || {}).reduce((s, v) => s + v, 0);
      return sumB - sumA;
    });

    let maxAbs = 0;
    Object.values(grid).forEach(row => {
      Object.values(row).forEach(v => { maxAbs = Math.max(maxAbs, Math.abs(v)); });
    });

    return {
      categories,
      months: sortedMonths.map(mk => ({ key: mk, label: monthLabel(mk) })),
      grid,
      maxAbs: maxAbs || 1,
    };
  }, [products, invoices]);

  const cellColor = (value) => {
    if (value === undefined) return { background: 'var(--bg)', color: 'var(--muted)' };
    const ratio = Math.min(1, Math.abs(value) / maxAbs);
    if (value >= 0) {
      // أخضر بدرجات: كل ما زاد الربح كل ما غمق اللون
      const alpha = 0.15 + ratio * 0.65;
      return { background: `rgba(34, 139, 87, ${alpha})`, color: alpha > 0.5 ? '#fff' : '#1F5B4E' };
    }
    const alpha = 0.15 + ratio * 0.65;
    return { background: `rgba(192, 57, 43, ${alpha})`, color: alpha > 0.5 ? '#fff' : '#7A2E24' };
  };

  if (categories.length === 0) {
    return (
      <div style={styles.reportSection}>
        <div style={styles.recentTitle}>خريطة الربح الحرارية</div>
        <div style={styles.emptySmall}>ما في مبيعات كافية بعد لعرض خريطة الربح</div>
      </div>
    );
  }

  return (
    <div style={styles.reportSection}>
      <div style={styles.recentTitle}>خريطة الربح الحرارية (حسب الفئة والشهر)</div>
      <div style={styles.heatmapWrap}>
        <table style={styles.heatmapTable}>
          <thead>
            <tr>
              <th style={styles.heatmapRowLabel}>الفئة</th>
              {months.map(m => (
                <th key={m.key} style={styles.heatmapHeadCell}>{m.label}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {categories.map(cat => (
              <tr key={cat}>
                <td style={styles.heatmapRowLabel}>{cat}</td>
                {months.map(m => {
                  const value = grid[cat]?.[m.key];
                  return (
                    <td key={m.key} style={{ ...styles.heatmapCell, ...cellColor(value) }}>
                      {value !== undefined ? fmtInt(value) : '—'}
                    </td>
                  );
                })}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <div style={styles.heatmapLegendRow}>
        <span style={{ ...styles.heatmapLegendSwatch, background: 'rgba(192, 57, 43, 0.7)' }} />
        <span>خسارة/ربح منخفض</span>
        <span style={{ ...styles.heatmapLegendSwatch, background: 'rgba(34, 139, 87, 0.7)', marginInlineStart: 10 }} />
        <span>ربح مرتفع</span>
      </div>
    </div>
  );
}

// ================= شاشة استيراد الكتالوج =================
function ImportModal({ onClose, onImported, showToast, existingCount }) {
  const [status, setStatus] = useState('idle'); // idle | loading | error
  const [errorMsg, setErrorMsg] = useState('');
  const fileRef = useRef(null);

  const handleFile = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    setStatus('loading');
    setErrorMsg('');
    try {
      const products = await parseFileToProducts(file, existingCount);
      if (products.length === 0) {
        throw new Error('ما لقيت أي صنف بالملف. تأكد من الأعمدة (اسم المادة، السعر...)');
      }
      onImported(products);
      showToast(`تم استيراد ${products.length} صنف ✓`);
      onClose();
    } catch (err) {
      setStatus('error');
      setErrorMsg(err.message || 'صار خطأ بقراءة الملف');
    }
  };

  return (
    <div style={styles.sheetOverlay} onClick={onClose}>
      <div style={styles.sheet} onClick={e => e.stopPropagation()}>
        <div style={styles.sheetHandle} />
        <div style={styles.sheetHeader}>
          <div style={{ flex: 1 }}>
            <div style={styles.sheetTitle}>استيراد كتالوج</div>
            <div style={styles.sheetSub}>ملف Excel (.xlsx) أو CSV فيه أعمدة: اسم المادة، سعر الشراء، سعر البيع...</div>
          </div>
          <button style={styles.sheetClose} onClick={onClose}><X size={18} /></button>
        </div>

        <div style={styles.importDrop} onClick={() => fileRef.current?.click()}>
          <FileSpreadsheet size={28} style={{ color: 'var(--accent)' }} />
          <div style={{ fontWeight: 700, fontSize: 13.5 }}>
            {status === 'loading' ? 'عم أقرأ الملف...' : 'اضغط لاختيار ملف'}
          </div>
          <div style={{ fontSize: 11.5, color: 'var(--muted)' }}>xlsx, xls, csv</div>
        </div>
        <input ref={fileRef} type="file" accept=".xlsx,.xls,.csv" style={{ display: 'none' }} onChange={handleFile} />

        {status === 'error' && (
          <div style={styles.importError}><AlertTriangle size={14} /> {errorMsg}</div>
        )}

        <div style={styles.importNote}>
          الأصناف الموجودة أصلاً بتضل متل ما هي — الاستيراد بيضيف أصناف جديدة فقط، وممكن تعدّل أي سعر بعدين من صفحة المخزون.
        </div>
      </div>
    </div>
  );
}

  const [viewInvoice, setViewInvoice] = useState(null);

  useEffect(() => {
    persistState({ products, customers, invoices, payments, shop });
  }, [products, customers, invoices, payments, shop]);

  const showToast = useCallback((msg) => {
    setToast(msg);
    setTimeout(() => setToast(null), 2400);
  }, []);

  const updateProduct = useCallback((id, patch) => {
    setProducts(prev => prev.map(p => p.id === id ? { ...p, ...patch } : p));
  }, []);

  const adjustStock = useCallback((id, delta) => {
    setProducts(prev => prev.map(p => p.id === id ? { ...p, qty: p.qty + delta } : p));
  }, []);

  const deleteProduct = useCallback((id) => {
    setProducts(prev => prev.filter(p => p.id !== id));
  }, []);

  const addCustomer = useCallback((name) => {
    const c = { id: uid('c'), name, projects: ['عام'] };
    setCustomers(prev => [...prev, c]);
    return c;
  }, []);

  const handleImported = useCallback((newProducts) => {
    setProducts(prev => [...prev, ...newProducts]);
  }, []);

  const viewInvoiceCustomer = viewInvoice ? customers.find(c => c.id === viewInvoice.customerId) : null;

  return (
    <div dir="rtl" style={styles.app}>
      <style>{GLOBAL_CSS}</style>
      <Header shop={shop} tab={tab} setTab={setTab} onOpenSettings={() => setShowSettings(true)} />

      <main style={styles.main}>
        {tab === 'inventory' && (
          <InventoryView
            products={products}
            updateProduct={updateProduct}
            adjustStock={adjustStock}
            deleteProduct={deleteProduct}
            onImportClick={() => setShowImport(true)}
            showToast={showToast}
          />
        )}
        {tab === 'invoice' && (
          <InvoiceView
            products={products}
            adjustStock={adjustStock}
            customers={customers}
            addCustomer={addCustomer}
            invoices={invoices}
            setInvoices={setInvoices}
            shop={shop}
            showToast={showToast}
            setViewInvoice={setViewInvoice}
          />
        )}
        {tab === 'customers' && (
          <CustomersView
            customers={customers}
            setCustomers={setCustomers}
            invoices={invoices}
            payments={payments}
            setPayments={setPayments}
            showToast={showToast}
          />
        )}
        {tab === 'reports' && (
          <ReportsView products={products} invoices={invoices} payments={payments} />
        )}
      </main>

      <TabBar tab={tab} setTab={setTab} />

      {showSettings && (
        <SettingsModal shop={shop} setShop={setShop} onClose={() => setShowSettings(false)} showToast={showToast} />
      )}

      {showImport && (
        <ImportModal
          onClose={() => setShowImport(false)}
          onImported={handleImported}
          showToast={showToast}
          existingCount={products.length}
        />
      )}

      {viewInvoice && (
        <InvoiceModal
          invoice={viewInvoice}
          customer={viewInvoiceCustomer}
          shop={shop}
          onClose={() => setViewInvoice(null)}
          showToast={showToast}
        />
      )}

      {toast && <div style={styles.toast}>{toast}</div>}
    </div>
  );
}

const rootEl = document.getElementById('root');
ReactDOM.createRoot(rootEl).render(<App />);

</script>
</body>
</html>
