<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Leak Rush</title>
<style>
:root{--bg:#10202b;--panel:#17313f;--water:#2fa8e8;--leak:#ff5a4a;--ok:#5be39b;--ink:#eaf4f8;--dim:#8fb0bf}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;overflow:hidden;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.scr{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom));background:rgba(16,32,43,.94);text-align:center;overflow:auto;touch-action:pan-y}
.hidden{display:none}
h1{margin:0;font-size:2.4rem;letter-spacing:.5px}
p{margin:0;color:var(--dim);line-height:1.6;max-width:30em}
#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;width:min(420px,100%)}
button{font:inherit;color:var(--ink);background:var(--panel);border:2px solid #2a4a5b;border-radius:14px;padding:12px 8px;cursor:pointer}
button:active{transform:scale(.96)}
button:disabled{opacity:.35;cursor:default}
.lv b{display:block;font-size:1.3rem}
.lv i{font-style:normal;font-size:.75rem;color:#ffd24a;letter-spacing:1px}
.btn{background:var(--water);border-color:var(--water);color:#06202e;font-weight:700;padding:12px 22px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#stars{font-size:2.2rem;color:#ffd24a;letter-spacing:6px}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="menu" class="scr">
  <h1>Leak Rush</h1>
  <p>الأنابيب بتسرّب! اضغط مطوّلاً على كل تسريب لحد ما يتسكّر، قبل ما الغرفة تغرق. زر المحبس بيوقف التسريب لثواني.</p>
  <div id="grid"></div>
</div>

<div id="res" class="scr hidden">
  <h1 id="rt"></h1>
  <div id="stars"></div>
  <p id="rs"></p>
  <div class="row">
    <button class="btn" id="bn">المستوى التالي</button>
    <button id="br">إعادة</button>
    <button id="bm">القائمة</button>
  </div>
</div>

<script>
"use strict";
//LOGIC-START
// كل مستوى = سطر واحد. للإضافة: انسخ سطر وعدّل الأرقام.
// t:مدة المستوى(ث) spawn:فاصل ظهور التسريب(ث) max:أقصى عدد تسريبات
// hold:زمن الإصلاح(ث) flow:ارتفاع المية %/ث لكل تسريب drain:تصريف %/ث
// valve:انتظار المحبس(ث، 0=بدون) tough:احتمال تسريب صعب (ضعف الوقت)
const LEVELS=[
 {t:25,spawn:2.2,max:2,hold:.5,flow:1.2,drain:.3,valve:0,tough:0},
 {t:30,spawn:2.0,max:3,hold:.5,flow:1.3,drain:.3,valve:0,tough:0},
 {t:30,spawn:1.8,max:3,hold:.6,flow:1.4,drain:.3,valve:18,tough:0},
 {t:35,spawn:1.6,max:4,hold:.6,flow:1.5,drain:.3,valve:18,tough:.15},
 {t:35,spawn:1.5,max:4,hold:.65,flow:1.4,drain:.3,valve:16,tough:.2},
 {t:40,spawn:1.4,max:5,hold:.65,flow:1.3,drain:.3,valve:16,tough:.2},
 {t:40,spawn:1.3,max:5,hold:.7,flow:1.4,drain:.3,valve:15,tough:.25},
 {t:45,spawn:1.25,max:6,hold:.7,flow:1.5,drain:.3,valve:15,tough:.3},
 {t:45,spawn:1.25,max:6,hold:.7,flow:1.5,drain:.3,valve:14,tough:.3},
 {t:50,spawn:1.2,max:6,hold:.75,flow:1.55,drain:.3,valve:14,tough:.3}
];
const ROWS=[.1,.27,.44,.61];
const FREEZE=3;
function mkSim(L,rnd){return{L:L,rnd:rnd,time:0,water:0,leaks:[],uid:0,next:.6,valveT:0,valveCD:0,fixed:0,state:"play",stars:0};}
function pickPos(s){
  for(let i=0;i<25;i++){
    const r=Math.floor(s.rnd()*ROWS.length),x=.1+s.rnd()*.8;
    if(!s.leaks.some(l=>l.r===r&&Math.abs(l.x-x)<.16))return{r:r,x:x};
  }
  return null;
}
function useValve(s){
  if(s.state==="play"&&s.L.valve>0&&s.valveT===0&&s.valveCD===0){s.valveT=FREEZE;s.valveCD=s.L.valve;return true;}
  return false;
}
function step(s,dt,held){
  if(s.state!=="play")return;
  const L=s.L;
  s.time+=dt;
  if(s.valveT>0)s.valveT=Math.max(0,s.valveT-dt);
  else if(s.valveCD>0)s.valveCD=Math.max(0,s.valveCD-dt);
  if(s.valveT===0){
    s.next-=dt;
    if(s.next<=0){
      if(s.leaks.length<L.max){
        const p=pickPos(s);
        if(p)s.leaks.push({id:++s.uid,r:p.r,x:p.x,tough:s.rnd()<L.tough,prog:0,age:0});
      }
      s.next=L.spawn*(.7+s.rnd()*.6);
    }
    s.water+=s.leaks.length*L.flow*dt;
  }
  s.water=Math.max(0,s.water-L.drain*dt);
  const keep=[];
  for(const k of s.leaks){
    k.age+=dt;
    const need=L.hold*(k.tough?2:1);
    if(held&&held.has(k.id))k.prog+=dt/need;else k.prog=Math.max(0,k.prog-dt/need*2);
    if(k.prog>=1)s.fixed++;else keep.push(k);
  }
  s.leaks=keep;
  if(s.water>=100){s.water=100;s.state="lose";}
  else if(s.time>=L.t){s.state="win";s.stars=s.water<30?3:s.water<60?2:1;}
}
//LOGIC-END

// ---------- واجهة ولعب ----------
const cv=document.getElementById("c"),ctx=cv.getContext("2d");
const $=id=>document.getElementById(id);
let W=0,H=0,top=0,bot=0,sim=null,lvl=0,drops=[],pointers=new Map(),last=0,running=false,vbtn={x:0,y:0,r:38};
let save={stars:[]};
try{const j=JSON.parse(localStorage.getItem("leakrush_v1")||"null");if(j&&Array.isArray(j.stars))save=j;}catch(e){}
function persist(){try{localStorage.setItem("leakrush_v1",JSON.stringify(save));}catch(e){}}
function unlocked(i){return i===0||(save.stars[i-1]||0)>0;}

function resize(){
  const d=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  cv.width=Math.round(W*d);cv.height=Math.round(H*d);
  ctx.setTransform(d,0,0,d,0,0);
  top=72;
  bot=H-100;
  vbtn={x:W/2,y:H-52,r:38};
}
window.addEventListener("resize",resize);
resize();

function buildMenu(){
  const g=$("grid");g.innerHTML="";
  LEVELS.forEach((L,i)=>{
    const b=document.createElement("button");
    b.className="lv";
    const n=save.stars[i]||0;
    b.innerHTML="<b>"+(i+1)+"</b><i>"+"★".repeat(n)+"☆".repeat(3-n)+"</i>";
    b.disabled=!unlocked(i);
    b.onclick=()=>start(i);
    g.appendChild(b);
  });
}
function start(i){
  lvl=i;sim=mkSim(LEVELS[i],Math.random);drops=[];pointers.clear();
  $("menu").classList.add("hidden");$("res").classList.add("hidden");
  last=performance.now();
  if(!running){running=true;requestAnimationFrame(loop);}
}
function showMenu(){
  sim=null;buildMenu();
  $("res").classList.add("hidden");$("menu").classList.remove("hidden");
}
function finish(){
  const win=sim.state==="win";
  if(win){save.stars[lvl]=Math.max(save.stars[lvl]||0,sim.stars);persist();}
  $("rt").textContent=win?"أحسنت! المستوى "+(lvl+1):"الغرفة غرقت!";
  $("stars").textContent=win?"★".repeat(sim.stars)+"☆".repeat(3-sim.stars):"";
  $("rs").textContent=win?"سكّرت "+sim.fixed+" تسريب. كل ما قلّت المية، زادت النجوم.":"جرّب تبدأ بالتسريبات القديمة، واستخدم المحبس لما تتكاثر.";
  $("bn").style.display=(win&&lvl<LEVELS.length-1)?"":"none";
  $("res").classList.remove("hidden");
  try{if(navigator.vibrate)navigator.vibrate(win?[40,40,40]:200);}catch(e){}
}
$("bn").onclick=()=>start(lvl+1);
$("br").onclick=()=>start(lvl);
$("bm").onclick=showMenu;

// ---------- إدخال ----------
function lpos(k){return{x:k.x*W,y:top+(bot-top)*ROWS[k.r]};}
cv.addEventListener("pointerdown",e=>{
  if(!sim||sim.state!=="play")return;
  e.preventDefault();
  try{cv.setPointerCapture(e.pointerId);}catch(x){}
  const dx=e.clientX-vbtn.x,dy=e.clientY-vbtn.y;
  if(dx*dx+dy*dy<=(vbtn.r+10)*(vbtn.r+10)){useValve(sim);return;}
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
});
cv.addEventListener("pointermove",e=>{const p=pointers.get(e.pointerId);if(p){p.x=e.clientX;p.y=e.clientY;}});
const up=e=>{pointers.delete(e.pointerId);};
cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);cv.addEventListener("lostpointercapture",up);

function heldSet(){
  const set=new Set();
  pointers.forEach(p=>{
    let best=null,bd=48*48;
    for(const k of sim.leaks){
      if(set.has(k.id))continue;
      const q=lpos(k),d=(q.x-p.x)**2+(q.y-p.y)**2;
      if(d<bd){bd=d;best=k;}
    }
    if(best)set.add(best.id);
  });
  return set;
}

// ---------- حلقة اللعب ----------
function loop(now){
  if(!sim){running=false;return;}
  const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;
  if(sim.state==="play"){
    const held=heldSet();
    step(sim,dt,held);
    if(sim.valveT===0){
      for(const k of sim.leaks)if(Math.random()<dt*9){const q=lpos(k);drops.push({x:q.x,y:q.y,v:0});}
    }
    if(sim.state!=="play"){draw(dt);finish();}
  }
  const surf=bot-(bot-top)*sim.water/100;
  for(let i=drops.length-1;i>=0;i--){
    const d=drops[i];d.v+=900*dt;d.y+=d.v*dt;
    if(d.y>=surf||d.y>bot)drops.splice(i,1);
  }
  if(drops.length>150)drops.splice(0,drops.length-150);
  draw(dt);
  if(sim.state==="play")requestAnimationFrame(loop);else running=false;
}

function pipe(y,frozen){
  ctx.lineCap="round";
  ctx.strokeStyle=frozen?"#4a7a96":"#6d8493";ctx.lineWidth=18;
  ctx.beginPath();ctx.moveTo(-10,y);ctx.lineTo(W+10,y);ctx.stroke();
  ctx.strokeStyle="rgba(255,255,255,.22)";ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(-10,y-4);ctx.lineTo(W+10,y-4);ctx.stroke();
  ctx.fillStyle=frozen?"#3b6781":"#52687a";
  for(const x of [W*.3,W*.7]){ctx.fillRect(x-7,y-12,14,24);}
}
function draw(){
  const s=sim,L=s.L,frozen=s.valveT>0,tm=performance.now()/1000;
  ctx.clearRect(0,0,W,H);
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#1c3a4b");g.addColorStop(1,"#0e1c26");
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(const r of ROWS)pipe(top+(bot-top)*r,frozen);
  // تسريبات
  for(const k of s.leaks){
    const q=lpos(k),R=k.tough?20:15,pulse=frozen?0:Math.sin(tm*10+k.id)*2;
    ctx.fillStyle=frozen?"#7aa6c0":(k.tough?"#b3261e":"#ff5a4a");
    ctx.beginPath();ctx.arc(q.x,q.y,R+pulse,0,7);ctx.fill();
    if(k.tough){ctx.strokeStyle="#ffd1cc";ctx.lineWidth=3;ctx.beginPath();ctx.arc(q.x,q.y,R+5,0,7);ctx.stroke();}
    ctx.strokeStyle="rgba(255,255,255,.25)";ctx.lineWidth=4;ctx.beginPath();ctx.arc(q.x,q.y,R+11,0,7);ctx.stroke();
    if(k.prog>0){ctx.strokeStyle="#5be39b";ctx.lineWidth=5;ctx.beginPath();ctx.arc(q.x,q.y,R+11,-Math.PI/2,-Math.PI/2+Math.PI*2*Math.min(1,k.prog));ctx.stroke();}
  }
  // قطرات
  ctx.fillStyle="#7fd0ff";
  for(const d of drops){ctx.beginPath();ctx.ellipse(d.x,d.y,3,6,0,0,7);ctx.fill();}
  // مية
  const surf=bot-(bot-top)*s.water/100;
  ctx.fillStyle="rgba(47,168,232,.62)";
  ctx.beginPath();ctx.moveTo(0,H);ctx.lineTo(0,surf);
  for(let x=0;x<=W;x+=16)ctx.lineTo(x,surf+Math.sin(x*.03+tm*2.2)*4);
  ctx.lineTo(W,H);ctx.closePath();ctx.fill();
  // HUD
  ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillStyle="#eaf4f8";ctx.font="700 18px system-ui,sans-serif";
  ctx.fillText("المستوى "+(lvl+1),W/2,top-40);
  const bw=Math.min(W-40,420),bx=(W-bw)/2,by=top-18,prog=Math.min(1,s.time/L.t);
  ctx.fillStyle="rgba(255,255,255,.15)";ctx.fillRect(bx,by,bw,8);
  ctx.fillStyle="#5be39b";ctx.fillRect(bx,by,bw*prog,8);
  ctx.font="600 14px system-ui,sans-serif";ctx.fillStyle=s.water>70?"#ff8a7e":"#eaf4f8";
  ctx.fillText("المية "+Math.floor(s.water)+"%",W/2,Math.min(bot-14,Math.max(top+12,surf-14)));
  // محبس
  if(L.valve>0){
    const v=vbtn,ready=s.valveT===0&&s.valveCD===0;
    ctx.fillStyle=ready?"#ffb02e":"#3d5463";ctx.beginPath();ctx.arc(v.x,v.y,v.r,0,7);ctx.fill();
    if(!ready){
      const f=s.valveT>0?s.valveT/FREEZE:1-s.valveCD/L.valve;
      ctx.strokeStyle=s.valveT>0?"#7fd0ff":"#8fb0bf";ctx.lineWidth=5;
      ctx.beginPath();ctx.arc(v.x,v.y,v.r-4,-Math.PI/2,-Math.PI/2+Math.PI*2*f);ctx.stroke();
    }
    ctx.fillStyle=ready?"#3a2400":"#cfe3ee";ctx.font="700 15px system-ui,sans-serif";ctx.fillText("محبس",v.x,v.y);
  }
}
showMenu();
</script>
</body>
</html>
