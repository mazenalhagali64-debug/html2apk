name: build-job
on:
  workflow_dispatch:
    inputs:
      id: { description: job id, required: true }
      name: { description: app name, required: true }
      ext: { description: html or zip, required: true }
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JOB_ID: ${{ inputs.id }}
      APP_NAME: ${{ inputs.name }}
      EXT: ${{ inputs.ext }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - run: pip install pillow
      - name: Unpack template
        run: echo '' | base64 -d | tar xz
      - run: python3 prepare.py
      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleRelease -PappId="com.htmlapp.$JOB_ID"
      - name: Publish
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "app-$JOB_ID.apk"
          gh release create "job-$JOB_ID" "app-$JOB_ID.apk" --title "job-$JOB_ID" --notes ok
      - name: Mark failure
        if: failure()
        run: gh release create "job-$JOB_ID" --title failed --notes failed || true
      - name: Delete uploaded files
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -rq "jobs/$JOB_ID" || true
          git commit -qm "cleanup $JOB_ID" || true
          for i in 1 2 3 4 5; do git pull --rebase --autostash -q && git push -q && break; sleep 3; done
