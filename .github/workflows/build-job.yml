<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>صانع التطبيقات</title>
<style>
:root{--bg:#eef3f1;--ink:#10222b;--mute:#4f6670;--card:#fff;--line:#cfdcd8;--main:#0b6e5f;--go:#ffc83d;--err:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#0e1a1f;--ink:#e8f1ee;--mute:#9db3ba;--card:#16272e;--line:#2a3f47;--main:#4fd1b5;--err:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.7 system-ui,sans-serif;min-height:100vh;padding:24px 16px 48px;display:flex;justify-content:center}
main{width:100%;max-width:460px}
h1{font-size:25px;line-height:1.35;font-weight:800;margin:0 0 4px}
p.sub{margin:0 0 20px;color:var(--mute)}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;margin:0 auto 20px;width:120px}
.ico{width:96px;height:96px;border-radius:24px;background:var(--card);border:2px dashed var(--line);display:grid;place-items:center;overflow:hidden;cursor:pointer;color:var(--mute);font-size:13px;text-align:center;padding:6px}
.ico img{width:100%;height:100%;object-fit:cover}
.tile b{font-size:15px;max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
label{display:block;font-weight:600;margin:14px 0 6px}
input[type=text],input[type=password]{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit}
.file{display:block;padding:14px;border:1.5px dashed var(--main);border-radius:12px;background:var(--card);cursor:pointer;color:var(--main);font-weight:600;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
input[type=file]{display:none}
button,a.btn{display:block;width:100%;margin-top:20px;padding:15px;border:0;border-radius:14px;background:var(--go);color:#10222b;font:800 19px system-ui,sans-serif;text-align:center;text-decoration:none;cursor:pointer}
button.alt{background:transparent;border:1.5px solid var(--line);color:var(--ink);font-size:16px;font-weight:600}
#msg,#smsg{min-height:1.6em;margin-top:12px;color:var(--err);font-weight:600}
.state{text-align:center;padding:26px 0}
.spin{width:44px;height:44px;margin:0 auto 14px;border:5px solid var(--line);border-top-color:var(--main);border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.tip{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:16px;color:var(--mute);font-size:15px;text-align:start}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
