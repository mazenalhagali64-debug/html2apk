name: build-offline-3
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Fixed signing key
        run: |
          mkdir -p ~/.android
          echo '' | base64 -d > /tmp/k.pem
          echo '' | base64 -d > /tmp/c.pem
          openssl pkcs12 -export -inkey /tmp/k.pem -in /tmp/c.pem -name androiddebugkey -out ~/.android/debug.keystore -passout pass:android -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1
          openssl pkcs8 -topk8 -nocrypt -in /tmp/k.pem -outform DER -out /tmp/key.pk8
          openssl x509 -in /tmp/c.pem -outform DER -out /tmp/cert.der
      - run: pip install pillow
      - name: Unpack
        run: |
          mkdir shell builder
          echo '' | base64 -d | tar xz -C shell
          echo '' | base64 -d | tar xz -C builder
      - name: Build template app
        working-directory: shell
        run: |
          mkdir -p jobs/templateab
          echo '<!doctype html><meta charset=utf-8><h1>template</h1>' > jobs/templateab/input.html
          sed -i 's/\.strip()\[:40\]/.strip()[:100]/' prepare.py
          grep -q '\[:100\]' prepare.py
          JOB_ID=templateab EXT=html APP_NAME="APPNAMEPLACEHOLDERXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX" python3 prepare.py
          cd android
          gradle --no-daemon assembleRelease -PappId=com.htmlapp.zzzzzzzzzzzz
      - name: Add template and keys to builder
        run: |
          D=builder/app/src/main/assets
          cp shell/android/app/build/outputs/apk/release/app-release.apk $D/template.apk
          cd $D
          cp /tmp/key.pk8 /tmp/cert.der .
      - name: Build builder app
        working-directory: builder
        run: gradle --no-daemon assembleRelease -PappId=com.htmlapp.builder2
      - name: Publish
        run: |
          cp builder/app/build/outputs/apk/release/app-release.apk offline-builder-3.apk
          gh release create "offline3-${{ github.run_number }}" offline-builder-3.apk --title "offline builder 3" --notes ok
