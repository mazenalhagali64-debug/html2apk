name: Build Latest Zip APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Set up Java JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Find and Extract The Very Latest ZIP File
        run: |
          mkdir project
          # أمر يقوم باختيار أحدث ملف zip تم تعديله/رفعه مؤخراً في المستودع فك ضغطه حصراً
          LATEST_ZIP=$(ls -t *.zip | head -n 1)
          echo "Using latest zip file: $LATEST_ZIP"
          unzip -o "$LATEST_ZIP" -d project/

      - name: Build Android App via Gradle / Capacitor
        run: |
          cd project
          # الدخول لأول مجلد ينتج عن فك الضغط تلقائياً
          cd $(ls -d */ | head -n 1)
          
          if [ -f "package.json" ]; then
            npm install
            npx cap sync android || true
          fi

          if [ -d "android" ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug
          elif [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          fi

      - name: Upload APK Result
        uses: actions/upload-artifact@v3
        with:
          name: latest-app-apk
          path: |
            project/**/android/app/build/outputs/apk/debug/*.apk
            project/**/*.apk
