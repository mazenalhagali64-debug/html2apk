name: Build Specific APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Set up Java JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract Target Project Zip Only
        run: |
          mkdir project
          # ضع هنا اسم ملفك الأصلي بدقة لكي لا يفك ضغط ملف الكاميرا بدلاً منه
          unzip -o "studio-pro-capacitor1.zip" -d project/

      - name: Build Android App
        run: |
          cd project
          # البحث عن مجلد الأندرويد أو ملفات Gradle وبناء التطبيق
          if [ -d "android" ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            # إذا كان مشروع كاباسيتور
            npx cap init || true
            npx cap sync android || true
            if [ -d "android" ]; then
              cd android
              chmod +x gradlew
              ./gradlew assembleDebug
            fi
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: my-app-apk
          path: |
            project/**/android/app/build/outputs/apk/debug/*.apk
            project/**/*.apk
